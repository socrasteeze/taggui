name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Qt runtime libraries
        # PySide6 wheels link against these; the GitHub runner image does not
        # ship them. The suite itself runs on the offscreen platform plugin.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install test dependencies
        # Test dependencies only. torch, transformers and onnxruntime are
        # deliberately excluded: model loading is verified on hardware.
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Byte-compile the application
        run: python -m compileall -q taggui

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
